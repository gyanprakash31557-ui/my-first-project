<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f0f7ff;
      color: #183153;
      padding: 40px 20px;
    }
    .card {
      background: white;
      padding: 28px 18px;
      border-radius: 16px;
      max-width: 420px;
      margin: 30px auto;
      box-shadow: 0 4px 15px #0001;
    }
    h1 { color: #1769aa; }
    button {
      background: #1769aa;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome to My Website!</h1>
    <p>Hello! I am learning technology and building my first website.</p>
    <p>This is my first project on GitHub.</p>
    <button onclick="alert('Congratulations! Your website works!')">Click Me</button>
  </div>
</body>
</html>
